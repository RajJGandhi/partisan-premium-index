name: PPI Production Pipeline

on:
  workflow_dispatch:
    inputs:
      run_pipeline:
        description: "Run market collection before rebuilding the website"
        required: true
        default: true
        type: boolean

  schedule:
    - cron: "17 10 * * *"
    - cron: "17 18 * * *"

  push:
    branches:
      - main
    paths:
      - "web/**"
      - "scripts/export_public_bundle.py"
      - "requirements.txt"
      - ".github/workflows/ppi-daily.yml"

permissions:
  contents: read

concurrency:
  group: ppi-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Update data and deploy public site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LLM_PROVIDER: deterministic
      GDELT_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        run: |
          PYTHONPATH=. python scripts/migrate_db.py

      - name: Seed production market definitions
        run: |
          PYTHONPATH=. python scripts/seed_production_markets.py

      - name: Run scheduled PPI pipeline
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.run_pipeline)
        run: |
          PYTHONPATH=. python scripts/run_ppi_daily.py \
            --trigger "github-${GITHUB_RUN_ID}"

      - name: Export sanitized public data
        run: |
          PYTHONPATH=. python scripts/export_public_bundle.py

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Validate and build public website
        working-directory: web
        run: npm run build

      - name: Scan deployable files for obvious secrets
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE \
            'postgresql://|postgres://|DATABASE_URL|SESSION_SECRET|PASSWORD_HASH|\$2[aby]\$' \
            web/dist; then
            echo "::error::Potential secret marker found in web/dist"
            exit 1
          fi

          echo "Public build secret scan passed."

      - name: Deploy to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name=partisan-premium-index \
            --branch=main
