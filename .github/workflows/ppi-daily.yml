name: PPI Production Pipeline

# Canonical schedule is 09:00 / 21:00 America/Toronto, executed on the self-hosted runner (see
# docs/SELF_HOSTED_RUNNER.md). Uses GitHub Actions' native per-entry `timezone:` field (added
# March 2026) so each cron entry fires at that exact Toronto local time year-round -- GitHub
# itself resolves the correct UTC offset for the current DST season, so there is no need for the
# old four-UTC-cron-entries-plus-runtime-recheck workaround this schedule used before.
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Which scheduled observation this run represents"
        required: true
        default: "adhoc"
        type: choice
        options:
          - primary
          - backup
          - adhoc
      force:
        description: "Force a retry even if this slot's run already completed (idempotent: reuses the same run_key, never duplicates immutable results)"
        required: true
        default: false
        type: boolean
      run_pipeline:
        description: "Run the canonical pipeline before rebuilding the public site (turn off to only re-export/rebuild/redeploy)"
        required: true
        default: true
        type: boolean

  schedule:
    # Primary: 09:00 America/Toronto, year-round (GitHub resolves the UTC offset for DST).
    - cron: "0 9 * * *"
      timezone: "America/Toronto"
    # Backup: 21:00 America/Toronto, year-round.
    - cron: "0 21 * * *"
      timezone: "America/Toronto"

  push:
    branches:
      - main
    paths:
      - "web/**"
      - "scripts/export_public_bundle.py"
      - "requirements.txt"
      - ".github/workflows/ppi-daily.yml"

permissions:
  contents: read

concurrency:
  group: ppi-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Run canonical pipeline and deploy public site
    # Self-hosted runner on the always-on Mac: only this machine can reach the local Ollama
    # instance the canonical blind-Qwen series requires. See docs/SELF_HOSTED_RUNNER.md for
    # installation. Label "ppi" is set at runner registration time.
    runs-on: [self-hosted, macOS, ppi]
    timeout-minutes: 45

    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Primary series as of 2026-08-26: DeepSeek V4 Flash 0731 via OpenRouter, not Qwen/Ollama.
      # See docs/research/DEEPSEEK_PRIMARY_CUTOVER_DEVIATION_20260826.md -- a documented deviation
      # from this project's own preregistered decision process, directed explicitly by Raj.
      # LLM_MODEL/LLM_BASE_URL are intentionally unset here: default_provider_config() special-
      # cases provider="openrouter" to build entirely from OPENROUTER_* settings below instead, so
      # there is exactly one place the primary model/URL can be configured, not two.
      LLM_PROVIDER: openrouter
      GDELT_ENABLED: "false"
      # Required for the primary series above (OpenRouter/DeepSeek). Never printed/logged; if
      # unset or empty, generate_blind_forecast's OpenRouter path fails the primary series
      # explicitly (MissingAPIKey) rather than silently falling back to any other provider.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # The secondary comparison series (Qwen3-8B via local Ollama on this self-hosted runner,
      # see qwen_provider_config) needs no env var here -- it reads ollama_base_url/ollama_model's
      # config defaults (http://localhost:11434, qwen3:8b), unchanged by this cutover. Per
      # docs/research/PPI_DEEPSEEK_VS_QWEN_PREREGISTRATION.md, a comparison-arm failure never
      # affects the primary DeepSeek series or the rest of this job.

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Determine run slot
        id: slot
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "slot=none" >> "$GITHUB_OUTPUT"
            echo "should_run_pipeline=false" >> "$GITHUB_OUTPUT"
            echo "Push-triggered run: re-export/rebuild/redeploy only, no pipeline run."
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="${{ inputs.slot }}"
            if [ "${{ inputs.run_pipeline }}" != "true" ]; then
              echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
              echo "should_run_pipeline=false" >> "$GITHUB_OUTPUT"
              echo "workflow_dispatch with run_pipeline=false: re-export/rebuild/redeploy only."
              exit 0
            fi
            echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
            echo "should_run_pipeline=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch: slot=$SLOT (explicit, not time-gated)."
            exit 0
          fi

          # Scheduled run: GitHub's native per-entry `timezone: America/Toronto` (see the
          # `on.schedule` block above) already guarantees this fires at exactly 09:00 (primary)
          # or 21:00 (backup) Toronto local time year-round, correctly adjusted for DST by GitHub
          # itself -- no runtime local-time recheck is needed here anymore.
          SCHEDULE="${{ github.event.schedule }}"

          if [ "$SCHEDULE" = "0 9 * * *" ]; then
            SLOT=primary
          elif [ "$SCHEDULE" = "0 21 * * *" ]; then
            SLOT=backup
          else
            SLOT=adhoc
          fi

          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "should_run_pipeline=true" >> "$GITHUB_OUTPUT"
          echo "cron='$SCHEDULE' slot=$SLOT (Toronto-local via native GitHub Actions timezone scheduling)"

      - name: Resolve pinned self-hosted Python (uv-managed, no sudo)
        shell: bash
        run: |
          set -euo pipefail
          # actions/setup-python's macOS build must run
          # `sudo installer -pkg ... -target /` to register a new Python version in
          # /Users/runner/hostedtoolcache -- that fails non-interactively on a self-hosted
          # runner (no TTY, no password prompt possible). uv instead manages a pinned,
          # relocatable, user-space Python build (python-build-standalone) that needs no
          # elevated privileges to install or run. See docs/SELF_HOSTED_RUNNER.md.
          #
          # Use uv's absolute install path, not PATH lookup: the runner's launchd job session
          # does not source ~/.zshrc/~/.zprofile (uv's installer only adds ~/.local/bin there),
          # and ~/.local/bin is not in /etc/paths or /etc/paths.d -- so a bare `uv` on PATH can
          # silently fail to resolve here even though it works in an interactive terminal.
          UV_BIN="$HOME/.local/bin/uv"
          if [ ! -x "$UV_BIN" ]; then
            echo "::error::uv is not installed at $UV_BIN. Run ops/self-hosted-runner/install.sh once on this Mac."
            exit 1
          fi

          REQUIRED_VERSION="$(cat .python-version)"
          "$UV_BIN" python install "$REQUIRED_VERSION"
          PYTHON_BIN="$("$UV_BIN" python find "$REQUIRED_VERSION" --no-project)"
          ACTUAL_VERSION="$("$PYTHON_BIN" -c 'import platform; print(platform.python_version())')"
          if [ "$ACTUAL_VERSION" != "$REQUIRED_VERSION" ]; then
            echo "::error::Resolved interpreter is $ACTUAL_VERSION, expected exactly $REQUIRED_VERSION. Refusing to silently use a different version."
            exit 1
          fi

          echo "Pinned interpreter: $PYTHON_BIN (Python $ACTUAL_VERSION)"
          dirname "$PYTHON_BIN" >> "$GITHUB_PATH"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: |
          # uv-managed Python installs mark themselves PEP 668 "externally managed" so a bare
          # `pip install` refuses to run. --break-system-packages is the mechanism pip itself
          # documents for this; it's safe here because this interpreter (~/.local/share/uv/python/
          # ...) exists solely for this workflow -- nothing else on the runner shares it, so
          # there's no "system" to break.
          python -m pip install --upgrade pip --break-system-packages
          pip install -r requirements.txt --break-system-packages

      # ------------------------------------------------------------------------------------------
      # Open the one canonical job_runs record NOW -- after checkout + Python are ready and
      # DATABASE_URL is in scope, but BEFORE the provider check, migrations, seeding, and the
      # pipeline. If any of those fails, the "Finalize canonical run record" step (if: always(),
      # at the very end) still closes this row as FAILED with an error_stage, so a pre-pipeline
      # failure can never again look like "nothing even attempted to run" in the database.
      # run_ppi_daily.py re-attaches to this exact row by run_key and fills in the counters and
      # its own terminal status; the finalizer only writes a status if nothing else already did.
      - name: Open canonical run record
        id: startrec
        if: steps.slot.outputs.should_run_pipeline == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then FORCE_FLAG="--force"; fi
          PYTHONPATH=. python scripts/job_run_lifecycle.py start \
            --trigger "${{ steps.slot.outputs.slot }}" \
            --strict-llm-only \
            --workflow-run-id "${{ github.run_id }}/${{ github.run_attempt }}" \
            --git-sha "${{ github.sha }}" \
            $FORCE_FLAG

      - name: Run database migrations
        id: migrate
        run: |
          PYTHONPATH=. python scripts/migrate_db.py

      - name: Seed production market definitions
        id: seedmarkets
        run: |
          PYTHONPATH=. python scripts/seed_production_markets.py

      - name: Check local Ollama for the Qwen comparison arm (non-blocking)
        id: verifyollama
        if: steps.slot.outputs.should_run_pipeline == 'true'
        shell: bash
        env:
          # The now-secondary Qwen/Ollama comparison arm reads app/config.py's ollama_model
          # default. The primary series is OpenRouter/DeepSeek (see the job env above) and does
          # NOT depend on local Ollama, so a problem here is a warning, never a hard failure --
          # a comparison-arm failure must never block the primary series or the deploy
          # (docs/research/PPI_DEEPSEEK_VS_QWEN_PREREGISTRATION.md). Before the 2026-08-26 cutover
          # this step read ${LLM_MODEL}, which the cutover removed from the job env -- under
          # `set -u` that made this step (and every scheduled run) fail with "LLM_MODEL: unbound
          # variable", halting collection.
          OLLAMA_MODEL: qwen3:8b
        run: |
          set -euo pipefail
          # Security guardrail (still hard): Ollama must never be exposed beyond localhost.
          if [ -n "${OLLAMA_HOST:-}" ] && [[ "$OLLAMA_HOST" != "127.0.0.1"* ]] && [[ "$OLLAMA_HOST" != "localhost"* ]]; then
            echo "::error::OLLAMA_HOST='$OLLAMA_HOST' is not localhost-only. Refusing to run the canonical pipeline."
            exit 1
          fi
          if ! curl -sf --max-time 5 http://127.0.0.1:11434/api/tags > /dev/null; then
            echo "::warning::Ollama not reachable at http://127.0.0.1:11434 -- the Qwen comparison arm will record provider failures; the primary OpenRouter/DeepSeek series is unaffected."
          elif ! curl -s http://127.0.0.1:11434/api/tags | grep -q "${OLLAMA_MODEL}"; then
            echo "::warning::Ollama model ${OLLAMA_MODEL} not pulled (run: ollama pull ${OLLAMA_MODEL}) -- Qwen comparison arm degraded; primary series unaffected."
          else
            echo "Ollama reachable at localhost with ${OLLAMA_MODEL} available."
          fi

      - name: Run canonical strict-LLM-only pipeline
        id: pipeline
        if: steps.slot.outputs.should_run_pipeline == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          PYTHONPATH=. python scripts/run_ppi_daily.py \
            --trigger "${{ steps.slot.outputs.slot }}" \
            --strict-llm-only \
            $FORCE_FLAG

      - name: Export sanitized public data (canonical runs only)
        id: exportpublic
        run: |
          PYTHONPATH=. python scripts/export_public_bundle.py

      - name: Export the PPI v1.5 shadow bundle (additive; never blocks the deploy)
        continue-on-error: true
        run: |
          # The v1.5 pipeline runs in its own workflow (ppi-v15-daily.yml) and writes the shadow
          # tables; this re-exports web/public/data/v15/*.json so the load-optional /v15 route
          # ships with the latest data. Shadow only -- does not touch the legacy public bundle.
          PYTHONPATH=. python scripts/export_v15_bundle.py --output web/public/data/v15

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Validate and build public website
        id: frontendbuild
        working-directory: web
        run: npm run build

      - name: Scan deployable files for obvious secrets
        id: secretscan
        shell: bash
        run: |
          set -euo pipefail

          if grep -RniE \
            'postgresql://|postgres://|DATABASE_URL|SESSION_SECRET|PASSWORD_HASH|\$2[aby]\$|ollama|11434' \
            web/dist; then
            echo "::error::Potential secret or internal-endpoint marker found in web/dist"
            exit 1
          fi

          echo "Public build secret scan passed."

      - name: Deploy to Cloudflare Pages
        id: deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler pages deploy dist \
            --project-name=partisan-premium-index \
            --branch=main

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## PPI pipeline run"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Slot: \`${{ steps.slot.outputs.slot }}\`"
            echo "- Pipeline executed: \`${{ steps.slot.outputs.should_run_pipeline }}\`"
            echo "- Result: \`${{ job.status }}\`"
            echo ""
            if [ "${{ job.status }}" != "success" ]; then
              echo "Failed or cancelled. GitHub sends a native failure notification to watchers of this repository."
              echo ""
              echo "Manual retry:"
              echo '```bash'
              echo "gh workflow run ppi-daily.yml -f slot=${{ steps.slot.outputs.slot }} -f force=true"
              echo '```'
              echo ""
              echo "See docs/SELF_HOSTED_RUNNER.md \"Manual retry procedure\" for details, including how"
              echo "the backup slot remains a distinct observation rather than silently replacing a"
              echo "failed primary run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ppi-failure-diagnostics-${{ github.run_id }}
          path: |
            reports/ppi_daily_digest_latest.md
          retention-days: 14
          if-no-files-found: ignore

      # The always() backstop for the lifecycle record. If the pipeline reached its own
      # finalization this is a no-op; if the job died in a prerequisite step (or was cancelled),
      # this transitions the RUNNING row opened above to FAILED with the coarse stage that broke.
      # It never flips a status the application already set, and the script always exits 0 so this
      # step can never itself fail the job.
      - name: Finalize canonical run record
        if: always() && steps.startrec.outcome == 'success'
        shell: bash
        env:
          PPI_ERROR_STAGE: >-
            ${{ steps.verifyollama.conclusion == 'failure' && 'provider_check'
             || steps.migrate.conclusion == 'failure' && 'migrate_db'
             || steps.seedmarkets.conclusion == 'failure' && 'seed_markets'
             || steps.pipeline.conclusion == 'failure' && 'run_pipeline'
             || steps.exportpublic.conclusion == 'failure' && 'export_public'
             || steps.frontendbuild.conclusion == 'failure' && 'frontend_build'
             || steps.secretscan.conclusion == 'failure' && 'secret_scan'
             || steps.deploy.conclusion == 'failure' && 'deploy'
             || '' }}
        run: |
          set -uo pipefail
          PYTHONPATH=. python scripts/job_run_lifecycle.py finalize \
            --run-key "${{ steps.startrec.outputs.run_key }}" \
            --trigger "${{ steps.slot.outputs.slot }}" \
            --workflow-conclusion "${{ job.status }}" \
            --error-stage "${PPI_ERROR_STAGE}" \
            --workflow-run-id "${{ github.run_id }}/${{ github.run_attempt }}" \
            --git-sha "${{ github.sha }}" || true
