name: PPI Daily Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "17 10 * * *"
    - cron: "17 18 * * *"

concurrency:
  group: ppi-daily-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          PYTHONPATH=. python scripts/migrate_db.py

      - name: Seed production markets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          PYTHONPATH=. python scripts/seed_production_markets.py

      - name: Run daily pipeline
        env:
          APP_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_PROVIDER: deterministic
          GDELT_ENABLED: "false"
        run: |
          PYTHONPATH=. python scripts/run_ppi_daily.py \
            --trigger "github-$(date -u +%H%M)"
