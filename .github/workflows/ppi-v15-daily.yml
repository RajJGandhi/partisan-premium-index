name: PPI v1.5 Pipeline (shadow)

# The 10-stage v1.5 pipeline: discover -> market snapshot -> political data -> validate -> quant ->
# evidence bundle -> blind (GPT/Claude) -> ensemble -> comparison -> publish.
#
# SHADOW ONLY. This workflow does NOT change the public headline series -- that stays the legacy
# blind-LLM series until the checklist in docs/research/PPI_CUTOVER.md is signed off and
# PPI_HEADLINE_SERIES is flipped. Runs alongside, never instead of, ppi-daily.yml.
#
# Enable by setting the repo variable PPI_V15_ENABLED=true (the job is a no-op otherwise) and
# providing DATABASE_URL + (optionally) OPENAI_API_KEY / ANTHROPIC_API_KEY as secrets. Without the
# LLM keys the blind stages record explicit SKIPPED_PROVIDER rows and the ensemble is unavailable.

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "primary | backup | adhoc"
        required: true
        default: "adhoc"
        type: choice
        options: [primary, backup, adhoc]
      blind:
        description: "Run live GPT/Claude blind benchmarks (needs OPENAI_API_KEY / ANTHROPIC_API_KEY)"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "20 9 * * *"
      timezone: "America/Toronto"
    - cron: "20 21 * * *"
      timezone: "America/Toronto"

permissions:
  contents: read

concurrency:
  group: ppi-v15-daily
  cancel-in-progress: false

jobs:
  v15-pipeline:
    runs-on: [self-hosted, macOS, ppi]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      VOTEHUB_API_KEY: ${{ secrets.VOTEHUB_API_KEY }}
      # Optional: unlocks the DDHQ Results API v4 -> state partisan lean (docs/OPERATIONS_V15.md
      # section 4a). Absent -> the seed-CSV fallback + polling-only degraded mode, which is fine.
      DECISIONDESK_CLIENT_ID: ${{ secrets.DECISIONDESK_CLIENT_ID }}
      DECISIONDESK_CLIENT_SECRET: ${{ secrets.DECISIONDESK_CLIENT_SECRET }}
      DECISIONDESK_API_KEY: ${{ secrets.DECISIONDESK_API_KEY }}
    steps:
      - name: Gate on PPI_V15_ENABLED
        id: gate
        run: |
          if [ "${{ vars.PPI_V15_ENABLED }}" != "true" ]; then
            echo "PPI_V15_ENABLED is not 'true' -- skipping the v1.5 shadow pipeline."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - name: Resolve pinned self-hosted Python (uv-managed, no sudo)
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # actions/setup-python's macOS build must `sudo installer -pkg ...` to register a new
          # Python in the hostedtoolcache -- that fails non-interactively on a self-hosted runner
          # (no TTY). uv manages a pinned, relocatable, user-space Python that needs no sudo.
          # Same mechanism as ppi-daily.yml; see docs/SELF_HOSTED_RUNNER.md.
          UV_BIN="$HOME/.local/bin/uv"
          if [ ! -x "$UV_BIN" ]; then
            echo "::error::uv is not installed at $UV_BIN. Run ops/self-hosted-runner/install.sh once on this Mac."
            exit 1
          fi
          REQUIRED_VERSION="$(cat .python-version)"
          "$UV_BIN" python install "$REQUIRED_VERSION"
          PYTHON_BIN="$("$UV_BIN" python find "$REQUIRED_VERSION" --no-project)"
          ACTUAL_VERSION="$("$PYTHON_BIN" -c 'import platform; print(platform.python_version())')"
          if [ "$ACTUAL_VERSION" != "$REQUIRED_VERSION" ]; then
            echo "::error::Resolved interpreter is $ACTUAL_VERSION, expected exactly $REQUIRED_VERSION."
            exit 1
          fi
          echo "Pinned interpreter: $PYTHON_BIN (Python $ACTUAL_VERSION)"
          dirname "$PYTHON_BIN" >> "$GITHUB_PATH"
      - name: Install
        if: steps.gate.outputs.enabled == 'true'
        run: |
          # uv-managed Python is PEP 668 "externally managed"; --break-system-packages is pip's
          # documented mechanism for that and is safe here -- this interpreter exists only for
          # this workflow. Same as ppi-daily.yml.
          python -m pip install --upgrade pip --break-system-packages
          pip install -r requirements.txt --break-system-packages
          if [ -n "${OPENAI_API_KEY}${ANTHROPIC_API_KEY}" ]; then pip install -r requirements-blind.txt --break-system-packages; fi
      - name: Migrate
        if: steps.gate.outputs.enabled == 'true'
        run: PYTHONPATH=. python scripts/migrate_db.py
      - name: Provider reachability (diagnostic)
        if: steps.gate.outputs.enabled == 'true'
        run: PYTHONPATH=. python scripts/check_providers.py --probe || true
      - name: Run v1.5 pipeline (stages 1-10)
        if: steps.gate.outputs.enabled == 'true'
        run: |
          SLOT="${{ github.event.inputs.slot || 'primary' }}"
          RUN_KEY="ppi-v15:$(date -u +%F):${SLOT}"
          # Default: Quant series only (no LLM cost). --blind adds GPT/Claude + a real ensemble,
          # and is only used when the workflow input asks for it AND at least one key is present.
          BLIND_FLAG=""
          if [ "${{ github.event.inputs.blind }}" = "true" ] && [ -n "${OPENAI_API_KEY}${ANTHROPIC_API_KEY}" ]; then
            BLIND_FLAG="--blind"
          fi
          # --discover auto-binds every supported statewide-race Polymarket contract; the seeded
          # data/seed/races_2026.json is the fallback set if discovery finds nothing / errors.
          PYTHONPATH=. python scripts/run_v15_daily.py --run-key "$RUN_KEY" --discover $BLIND_FLAG
      - name: Export the v1.5 public bundle
        if: steps.gate.outputs.enabled == 'true'
        run: PYTHONPATH=. python scripts/export_v15_bundle.py --output web/public/data/v15
      - name: Score any newly resolved races
        if: steps.gate.outputs.enabled == 'true'
        run: PYTHONPATH=. python scripts/run_scoring.py --all || true
